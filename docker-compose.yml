services:
  backend:
    build: ./backend
    container_name: studysync-backend
    env_file:
      - ./backend/.env
    environment:
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      - SECURE_SSL_REDIRECT=False
      - SQLITE_PATH=/app/db/db.sqlite3
    volumes:
      - sqlite_data:/app/db
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: studysync-frontend
    ports:
      - "${PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sqlite_data:
